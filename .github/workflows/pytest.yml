name: pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The full test suite requires an admin password to be configured;
      # without APP_PASSWORD, database tests error during fixture setup.
      APP_PASSWORD: ci-test-password
      SECRET_KEY: ci-test-only-not-a-real-key
      TRADESTAAR_NO_BACKGROUND: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: python -m pytest -q
