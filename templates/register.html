<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#060708" />
  <title>Create Account — Tradestaar Elite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #060708;
      --card:    #071830;
      --border:  rgba(255, 169, 77,0.18);
      --cyan:    #FFA94D;
      --green:   #22c55e;
      --red:     #ef4444;
      --amber:   #f59e0b;
      --text:    #dde8ff;
      --muted:   #5b7a9d;
      --dim:     #2e4a65;
      --mono:    'JetBrains Mono', 'Fira Code', monospace;
      --ui:      'Inter', -apple-system, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--ui);
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 169, 77,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 169, 77,0.025) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255, 169, 77,0.05) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    .login-wrap {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      gap: 2rem;
    }

    .login-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .login-brand-line {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.25em;
      color: var(--dim);
      text-transform: uppercase;
    }
    .login-brand-logo {
      width: 112px;
      height: 112px;
      object-fit: contain;
      border-radius: 22px;
      filter: drop-shadow(0 10px 28px rgba(255, 178, 76, 0.22));
    }
    .login-brand-name {
      font-family: var(--mono);
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 0.10em;
      color: var(--cyan);
      text-shadow: 0 0 24px rgba(255, 169, 77,0.40), 0 0 60px rgba(255, 169, 77,0.15);
      text-transform: uppercase;
    }
    .login-brand-sub {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.20em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 2px solid rgba(255, 169, 77,0.30);
      border-radius: 6px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255, 169, 77,0.05),
        0 8px 32px rgba(0,0,0,0.6),
        0 0 60px rgba(255, 169, 77,0.04);
    }

    .login-card-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 20px;
      background: rgba(0,0,0,0.35);
      border-bottom: 1px solid rgba(255, 169, 77,0.10);
    }
    .login-card-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .login-card-title {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--green);
    }

    .login-card-body {
      padding: 28px 24px 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .login-error {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(239,68,68,0.10);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--red);
    }

    .login-field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .login-label {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--dim);
    }
    .login-input {
      width: 100%;
      padding: 11px 14px;
      background: rgba(0,0,0,0.50);
      border: 1px solid rgba(255, 169, 77,0.15);
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      letter-spacing: 0.08em;
    }
    .login-input::placeholder { color: var(--dim); letter-spacing: 0.05em; }
    .login-input:focus {
      border-color: rgba(255, 169, 77,0.40);
      box-shadow: 0 0 0 3px rgba(255, 169, 77,0.06);
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      background: rgba(34,197,94,0.10);
      border: 1px solid rgba(34,197,94,0.28);
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--green);
      cursor: pointer;
      transition: all 0.15s;
    }
    .login-btn:hover {
      background: rgba(34,197,94,0.18);
      border-color: rgba(34,197,94,0.50);
      box-shadow: 0 0 16px rgba(34,197,94,0.12);
    }
    .login-btn:active { transform: scale(0.99); }

    .login-footer {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--dim);
      text-align: center;
      letter-spacing: 0.05em;
    }

    .login-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 9px;
      color: var(--dim);
      letter-spacing: 0.08em;
    }
    .login-status-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 4px var(--green);
    }

    @media(max-width:420px) {
      .login-brand-name { font-size: 22px; }
      .login-card { border-radius: 5px; }
    }
  </style>
</head>
<body>

<div class="login-wrap">

  <div class="login-brand">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Tradestaar Elite" class="login-brand-logo">
    <span class="login-brand-line">TRADESTAAR ELITE</span>
    <span class="login-brand-name">TRADESTAAR</span>
    <span class="login-brand-sub">Elite Market Intelligence · New Account</span>
  </div>

  <div class="login-card">

    <div class="login-card-header">
      <span class="login-card-dot"></span>
      <span class="login-card-title">Create Account</span>
    </div>

    <div class="login-card-body">

      {% if error %}
      <div class="login-error">
        ⚠ {{ error }}
      </div>
      {% endif %}

      <form method="POST" action="/register" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div style="display:flex;flex-direction:column;gap:20px;">

          <div class="login-field">
            <label class="login-label" for="username">Username</label>
            <input
              class="login-input"
              type="text"
              id="username"
              name="username"
              value="{{ username or '' }}"
              placeholder="Choose a username"
              autofocus
              autocomplete="username"
              maxlength="50"
            />
          </div>

          <div class="login-field">
            <label class="login-label" for="password">Password</label>
            <input
              class="login-input"
              type="password"
              id="password"
              name="password"
              placeholder="8+ characters"
              autocomplete="new-password"
            />
          </div>

          <div class="login-field">
            <label class="login-label" for="confirm_password">Confirm Password</label>
            <input
              class="login-input"
              type="password"
              id="confirm_password"
              name="confirm_password"
              placeholder="Repeat password"
              autocomplete="new-password"
            />
          </div>

          <button type="submit" class="login-btn">✦ Create Account</button>
        </div>
      </form>

      <div class="login-footer">
        Already have an account?
        <a href="/login" style="color:var(--cyan);text-decoration:none;opacity:0.80;margin-left:4px;transition:opacity 0.15s;"
           onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0.80'">
          Sign in →
        </a>
      </div>

    </div>
  </div>

  <div class="login-status">
    <span class="login-status-dot"></span>
    SYSTEM ONLINE
  </div>

</div>

</body>
</html>
