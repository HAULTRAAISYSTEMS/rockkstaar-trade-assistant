<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Market Intel — Rockkstaar Trade Assistant</title>
<style>
:root{--bg-primary:#0d0d0f;--bg-surface:#141416;--bg-card:#1a1a1e;--bg-card-hover:#1f1f24;--bg-inset:#111114;--border:rgba(255,255,255,0.07);--border-accent:rgba(255,255,255,0.12);--text-primary:#f0f0f2;--text-secondary:#888892;--text-muted:#55555f;--green:#22c55e;--green-dim:rgba(34,197,94,0.12);--red:#ef4444;--red-dim:rgba(239,68,68,0.12);--amber:#f59e0b;--amber-dim:rgba(245,158,11,0.12);--blue:#60a5fa;--accent:#7c5cfc;--font:'SF Mono','JetBrains Mono',monospace;--font-ui:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-ui);font-size:13px;line-height:1.5;min-height:100vh;}
.page{max-width:1280px;margin:0 auto;padding:20px;}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.page-title{font-size:18px;font-weight:600;}
.page-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;}
.badge-green{background:var(--green-dim);color:var(--green);border:1px solid rgba(34,197,94,0.2);}
.badge-amber{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(245,158,11,0.2);}
.badge-red{background:var(--red-dim);color:var(--red);border:1px solid rgba(239,68,68,0.2);}
.badge-blue{background:rgba(96,165,250,0.1);color:var(--blue);border:1px solid rgba(96,165,250,0.2);}
.badge-gray{background:rgba(255,255,255,0.05);color:var(--text-secondary);border:1px solid var(--border);}
.view-toggle{display:flex;gap:2px;background:var(--bg-inset);border:1px solid var(--border);border-radius:8px;padding:2px;}
.view-btn{padding:5px 14px;border-radius:6px;font-size:11px;font-weight:600;border:none;background:transparent;color:var(--text-secondary);cursor:pointer;transition:all 0.15s;}
.view-btn.active{background:var(--accent);color:#fff;}
.btn{padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;border:1px solid var(--border-accent);background:var(--bg-card);color:var(--text-primary);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all 0.15s;}
.btn:hover{background:var(--bg-card-hover);}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff;}
.panel{display:none;}.panel.active{display:block;}
.section{margin-bottom:20px;}
.section-title{font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.section-line{flex:1;height:1px;background:var(--border);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.card-header{padding:12px 16px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.card-title{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-secondary);}
.card-body{padding:14px 16px;}
.env-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);border-radius:8px;overflow:hidden;}
.env-cell{background:var(--bg-card);padding:14px 16px;display:flex;flex-direction:column;gap:4px;}
.env-label{font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-muted);}
.env-value{font-size:20px;font-family:var(--font);font-weight:600;}
.env-sub{font-size:11px;color:var(--text-secondary);}
.env-status{font-size:10px;font-weight:600;margin-top:4px;}
.regime-banner{border-radius:8px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;border:1px solid;}
.regime-banner.risk-on{background:rgba(34,197,94,0.06);border-color:rgba(34,197,94,0.2);}
.regime-banner.caution{background:rgba(245,158,11,0.06);border-color:rgba(245,158,11,0.2);}
.regime-banner.risk-off{background:rgba(239,68,68,0.06);border-color:rgba(239,68,68,0.2);}
.regime-banner.closed{background:rgba(255,255,255,0.03);border-color:rgba(255,255,255,0.08);}
.regime-text{font-size:13px;font-weight:600;}
.regime-sub{font-size:11px;color:var(--text-secondary);margin-top:2px;}
.sector-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.sector-cell{background:var(--bg-inset);border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;transition:border-color 0.2s;}
.sector-cell.hot{border-color:rgba(34,197,94,0.35);}
.sector-cell.cold{border-color:rgba(239,68,68,0.35);}
.sector-name{font-size:11px;font-weight:600;color:var(--text-secondary);}
.sector-etf{font-family:var(--font);font-size:10px;color:var(--text-muted);}
.sector-pct{font-family:var(--font);font-size:16px;font-weight:700;}
.level-row{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;border-bottom:1px solid var(--border);}
.level-row:last-child{border-bottom:none;}
.level-label{font-size:12px;color:var(--text-secondary);}
.level-value{font-family:var(--font);font-size:13px;font-weight:600;}
.earnings-list{display:flex;flex-direction:column;}
.earnings-row{display:grid;grid-template-columns:65px 1fr 110px 60px 100px 80px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);gap:12px;transition:background 0.1s;}
